# Ginkgo app. Generate the Xcode project with `xcodegen` in this folder (the .xcodeproj is not committed).
name: Ginkgo
options:
  # English is the fallback for languages without a translation; Chinese strings are the keys (Localizable.xcstrings).
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
packages:
  GinkgoKit:
    path: ../Packages/GinkgoKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: UBS9FUBNFR
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Ginkgo:
    type: application
    platform: iOS
    sources:
      - path: Ginkgo
    dependencies:
      - package: GinkgoKit
        product: GinkgoCore
      - package: GinkgoKit
        product: GinkgoAI
    info:
      path: Ginkgo/Info.plist
      properties:
        CFBundleDisplayName: Ginkgo
        # Versions come from the build settings above: bump CURRENT_PROJECT_VERSION for every upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS to the AI services, which is exempt from export filing.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets "Share / Open in Ginkgo" hand PDFs to the app; they are copied into the library.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        LSSupportsOpeningDocumentsInPlace: false
        # CloudKit pushes remote changes so the library updates while the app is open.
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Ginkgo/Ginkgo.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.kenjia.ginkgo]
        # CloudKit holds the library records; iCloud Drive (CloudDocuments) holds the PDF files.
        com.apple.developer.icloud-services: [CloudKit, CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.kenjia.ginkgo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.ginkgo
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  GinkgoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GinkgoTests
    dependencies:
      - target: Ginkgo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kenjia.ginkgo.tests
schemes:
  Ginkgo:
    build:
      targets:
        Ginkgo: all
        GinkgoTests: [test]
    test:
      targets: [GinkgoTests]
      # Tests read Chinese text; pin the language so they pass on any machine.
      commandLineArguments:
        "-AppleLanguages (zh-Hans)": true
